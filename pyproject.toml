[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "doku-agent"
version = "0.1.0"
description = "Lokaler KI-Dokumentations-Agent für Wiki.js, Netbox, Wazuh und Intune"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.9",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "tzdata>=2024.1",
    "numpy>=1.26,<3",
    "pysnmp>=7.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
doku-agent = "doku_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doku_agent = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
