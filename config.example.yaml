# doku-agent – Beispielkonfiguration. Kopieren nach config.yaml und anpassen.
# Geheimnisse nie hier eintragen, sondern als ${VARIABLE} aus der .env-Datei referenzieren.

general:
  language: Deutsch            # Sprache der erzeugten Texte
  data_dir: /data              # SQLite-Datenbank, Uploads (im Container: Volume agent-data)
  timezone: Europe/Vienna      # für den Zeitplan

llm:
  base_url: http://ollama:11434
  # 16 GB RAM, nur CPU: qwen3:8b (Q4, ca. 5 GB) ist der beste Kompromiss.
  # Schneller, aber schwächer: qwen3:4b. Nach Wechsel: LLM_MODEL in .env anpassen und Modell neu laden.
  model: qwen3:8b
  num_ctx: 8192                # Kontextfenster; größer = mehr RAM und langsamer
  temperature: 0.2
  timeout_s: 1800              # CPU-Antworten können mehrere Minuten dauern
  max_input_chars: 12000       # Eingabebudget pro Prompt; Längeres wird vorab zusammengefasst
  max_output_tokens: 2048      # Antwortlimit; verhindert endloses Generieren

wiki:
  url: https://wiki.example.local
  api_key: ${WIKI_API_KEY}
  locale: de
  verify_tls: true             # oder Pfad zur internen CA, z.B. /config/ca.pem
  # Zielpfade je Doku-Typ. Existiert dort schon ein Bereich mit Seiten, übernimmt der Agent
  # dessen Tags, Pflichtabschnitte und Pfad-Schreibweise (siehe Web-UI > Konventionen).
  paths:
    netbox_device: infrastruktur/geraete/{name}       # Platzhalter: {name} {site} {role}
    wazuh_rules: security/wazuh/regeln/{name}
    wazuh_decoders: security/wazuh/decoder/{name}
    wazuh_config: security/wazuh/konfiguration/{name}
    wazuh_sca: security/wazuh/sca/{name}
    intune_policy: clients/intune/{category}/{name}   # {category}: compliance, konfigurationsprofile, settings-catalog
    intune_apps: clients/intune/apps
    intune_groups: clients/intune/gruppen             # Entra-Gruppen mit Mitgliederzahlen und Zuweisungen
    fortigate: netzwerk/firewall/{device}/{section}   # {section}: regeln, nat, objekte, netzwerk, vpn; optional {vdom}
    wiki_lint: wartung/wiki-lint                      # Bericht des Wiki-Lint
    coverage: infrastruktur/abdeckung                 # Abdeckungsbericht (nach jeder Discovery)
    entra: identitaet/entra/{section}                 # conditional-access, benannte-standorte, authentifizierungs-
                                                      # staerken, authentifizierungsmethoden, mandant, rollen, pruefung
    entra_ca: identitaet/entra/conditional-access/{name}   # eine Seite je Conditional-Access-Richtlinie
    # Fehlende Einträge (z.B. neue Dokutypen nach einem Update) kommen automatisch aus den Standardwerten.
  tags:
    netbox_device: [netbox]
    wazuh_rules: [wazuh]
    wazuh_decoders: [wazuh]
    wazuh_config: [wazuh]
    wazuh_sca: [wazuh, sca]
    intune_policy: [intune]
    intune_apps: [intune]
    intune_groups: [intune]
    fortigate: [firewall, fortigate]
    wiki_lint: []
    coverage: [netbox]
    entra: [entra]
    entra_ca: [entra, conditional-access]
  convention_sample_pages: 5

netbox:
  enabled: true
  url: https://netbox.example.local
  token: ${NETBOX_TOKEN}
  verify_tls: true
  site: hq                     # Slug des Standorts, dem neu erkannte Maschinen zugeordnet werden
  status: active
  roles:                       # erste passende Regel gewinnt (Regex auf Betriebssystem)
    - os: "(?i)server|linux|ubuntu|debian|red ?hat|rhel|centos|rocky|alma|suse"
      role: server
    - os: ".*"
      role: client
  unknown_manufacturer: Unbekannt
  unknown_model: Unbekannt
  vm_cluster: null             # optional: Cluster-ID für erkannte VMs
  assign_ips: true
  set_primary_ip: true
  # Bereits eingetragene Maschinen abgleichen (jede Änderung einzeln freigebbar; [] = aus):
  #   missing = Leeres füllen, os = Plattform/VM-Ressourcen, network = IPs/MACs, rename = Hostname
  sync: [missing, os, network, rename]
  memory_tolerance_percent: 10 # RAM-Abweichung, ab der angepasst wird (OS meldet weniger als zugewiesen)
  # Custom Fields für feste Zuordnung (Wiedererkennung zuerst über diese IDs). Fehlen sie, schlägt die
  # Discovery einmalig vor, sie anzulegen. IDs werden mit Freigabe gesetzt, last_seen täglich ohne Freigabe.
  custom_fields:
    enabled: true
    wazuh_agent_id: wazuh_agent_id
    intune_device_id: intune_device_id
    last_seen: last_seen

wazuh:
  enabled: true
  url: https://wazuh-manager.example.local:55000
  username: ${WAZUH_USER}
  password: ${WAZUH_PASSWORD}
  verify_tls: true
  rules_dir: etc/rules         # nur eigene Regeln, nicht das Standard-Ruleset
  decoders_dir: etc/decoders
  sca_agents: []               # leer = alle aktiven Agents; sonst Liste von IDs oder Namen
  document_groups: true

intune:
  enabled: false
  tenant_id: ${INTUNE_TENANT_ID}
  client_id: ${INTUNE_CLIENT_ID}
  client_secret: ${INTUNE_CLIENT_SECRET}
  resolve_group_names: true    # braucht Group.Read.All (Namen, Art, Mitgliederzahlen)
  include: [compliance, configurations, settings_catalog, apps, groups]   # groups = Übersicht der Entra-Gruppen
  fetch_ethernet_mac: true
  discovery_os: [Windows, macOS, Linux]   # leer = alle (auch iOS/Android)

# Entra ID (nur lesend über Graph). Zugang leer = dieselbe App-Registrierung wie bei Intune.
# Anwendungsberechtigungen: Policy.Read.All, RoleManagement.Read.Directory, User.Read.All, Group.Read.All,
# optional Application.Read.All (App-Namen statt IDs). PIM-Daten nur mit Entra ID P2.
entra:
  enabled: false
  tenant_id: ""
  client_id: ""
  client_secret: ""
  include: [conditional_access, auth_methods, tenant_settings, roles, audit]
  user_names: name_upn         # name_upn = "Anzeigename (UPN)", name = nur Anzeigename, count = nur Anzahl
  breakglass: []               # Notfallkonten (UPN oder Objekt-ID), z.B. [breakglass1@firma.onmicrosoft.com]
  max_global_admins: 4         # mehr Globale Administratoren meldet die Prüfung

fortigate:
  enabled: false
  devices:                     # REST-API-Admin mit Admin-Profil "nur lesen", Token in .env
    - name: fw-zentrale        # Kurzname für Pfad und Titel
      url: https://fw-zentrale.example.local:8443
      token: ${FORTIGATE_TOKEN:-}
      verify_tls: true         # oder Pfad zur internen CA
      vdoms: [root]            # mehrere VDOMs: je VDOM eigene Seiten
      netbox_site: ""          # Standort in Netbox (leer = netbox.site)
  include: [policies, nat, objects, network, vpn, audit]   # audit = Prüfseite (verdeckte Regeln, any-any, ...)
  # Job fortigate_netbox: Firewall als Gerät mit Interfaces, IPs, VLANs, Präfixen (alles mit Freigabe)
  netbox_sync: [device, interfaces, ips, vlans, prefixes]
  netbox_role: firewall
  netbox_skip_roles: [wan]     # für WAN-Interfaces keine Präfixe anlegen
  steckbrief_rules: true       # Steckbrief zeigt Regeln, die die Maschine betreffen …
  steckbrief_min_prefix: 24    # … über Host-, Bereichs-, VIP- und Netzobjekte bis zu dieser Größe

vcenter:
  enabled: false
  url: https://vcenter.example.local
  username: ${VCENTER_USER:-}  # Benutzer mit Rolle "Nur lesen"
  password: ${VCENTER_PASSWORD:-}
  verify_tls: true
  vijson_release: "8.0.1.0"    # VI/JSON für Host-Hardware (ab vCenter 8.0 U1); "" = ohne Hersteller/Seriennummer
  hosts: true                  # ESXi-Hosts als Geräte (Rolle host_role)
  host_role: hypervisor
  powered_off: true            # ausgeschaltete VMs auch anlegen
  virtual_disks: true          # Disks einzeln als virtuelle Disks
  cluster_type: VMware vSphere

switches:
  enabled: false
  snmp:                        # Standard für alle Switches (je Switch überschreibbar)
    version: "2c"              # oder "3"
    community: ${SNMP_COMMUNITY:-}
    # v3: user, auth_protocol (sha256 …), auth_key, priv_protocol (aes …), priv_key
  devices:
    - host: 10.0.0.2           # nur diese Hosts werden per SNMP (UDP 161) abgefragt
      name: ""                 # leer = sysName
  netbox_role: switch
  mac_table: true              # Endgeräte über die MAC-Tabelle verkabeln …
  mac_table_max_macs: 1        # … nur an Ports mit so vielen gelernten MACs (keine Uplinks)

coverage:
  enabled: true                # Abdeckungsbericht nach jeder Discovery
  wazuh_roles: [server, client]   # Netbox-Rollen, die einen Wazuh-Agent haben müssen
  intune_roles: [client]
  stale_days: 30

# Lokale Embeddings (gleiches Ollama) für Fragen ans Wiki und bessere Seitenwahl bei freien Aufträgen
embeddings:
  enabled: true
  model: qwen3-embedding:0.6b  # mehrsprachig, ca. 640 MB; Alternative: bge-m3 (dann query_prefix: "")
  chunk_chars: 1500
  top_k: 6
  query_prefix: "Instruct: Given a question, retrieve wiki passages that answer the question\nQuery: "

lint:
  report_page: true            # Bericht zusätzlich als Wiki-Seite (Vorschlag)
  refresh_stale: true          # veraltete Seiten neu vorschlagen
  duplicate_threshold: 0.93    # ab dieser inhaltlichen Ähnlichkeit gelten Seiten als mögliche Dubletten
  exclude_paths: []            # z.B. [archiv]
  fix_links: true              # tote Links: eindeutigen Ersatz als Vorschlag mit Diff
  suggest_tags: true           # Seiten ohne Tags: Tags aus dem Ordner bzw. ähnlichen Seiten vorschlagen

# Nächtliche Läufe. Ergebnisse landen als Vorschläge in der Freigabe-Liste.
schedule:
  - {job: discovery, at: "01:30"}
  - {job: wazuh_rules, at: "02:00"}
  - {job: wazuh_decoders, at: "02:30"}
  - {job: wazuh_config, at: "03:00"}
  - {job: wazuh_sca, at: "03:30", days: [0]}   # nur montags
  # - {job: intune, at: "04:00"}
  # - {job: entra, at: "04:15"}
  # - {job: fortigate, at: "04:30"}
  # - {job: fortigate_netbox, at: "04:45"}
  # - {job: switches, at: "01:00"}
  - {job: wiki_index, at: "05:30"}             # Suchindex für Fragen ans Wiki
  - {job: wiki_lint, at: "06:00", days: [6]}   # sonntags

web:
  host: 0.0.0.0
  port: 8080
  username: admin
  password: ${WEB_PASSWORD}

egress:
  extra_allowed_hosts: []      # nur nötig, wenn ein Dienst auf einen anderen Host umleitet
  trust_env: false             # true = HTTP(S)_PROXY nutzen (z.B. Firmenproxy für Graph)
